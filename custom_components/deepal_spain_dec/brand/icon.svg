<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="55%" stop-color="#0c1728"/>
      <stop offset="100%" stop-color="#060c18"/>
    </radialGradient>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef3f9"/>
      <stop offset="28%" stop-color="#aebdd1"/>
      <stop offset="52%" stop-color="#5f7290"/>
      <stop offset="75%" stop-color="#8fa0ba"/>
      <stop offset="100%" stop-color="#d6dfec"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c8ba5"/>
      <stop offset="100%" stop-color="#2c3850"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d2e2"/>
      <stop offset="50%" stop-color="#f4f8fc"/>
      <stop offset="100%" stop-color="#9fb0c8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- emblem: three linked nodes forming a triangle, symbolising a community of members
       (deliberately a network/monogram motif, not a vehicle-badge silhouette) -->
  <g transform="translate(256,190)">
    <line x1="0" y1="-86" x2="76" y2="46" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="-86" x2="-76" y2="46" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
    <line x1="-76" y1="46" x2="76" y2="46" stroke="url(#metalDark)" stroke-width="7" stroke-linecap="round"/>

    <circle cx="0" cy="-86" r="22" fill="url(#metal)"/>
    <circle cx="76" cy="46" r="22" fill="url(#metal)"/>
    <circle cx="-76" cy="46" r="22" fill="url(#metal)"/>

    <circle cx="0" cy="-86" r="9" fill="#0c1728"/>
    <circle cx="76" cy="46" r="9" fill="#0c1728"/>
    <circle cx="-76" cy="46" r="9" fill="#0c1728"/>
  </g>

  <!-- DEC wordmark -->
  <text x="256" y="392"
        text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif"
        font-weight="700"
        font-size="150"
        letter-spacing="14"
        fill="url(#textGrad)">DEC</text>

  <!-- thin accent rule, echoing the community wordmark style -->
  <rect x="146" y="415" width="220" height="4" fill="#7f90ac" opacity="0.85"/>
</svg>
